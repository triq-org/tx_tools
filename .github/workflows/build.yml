name: Build check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos_macports_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} (macports)
    steps:
      - uses: actions/checkout@v7
      - uses: melusina-org/setup-macports@v1
      - name: Install ports
        run: sudo port install SoapySDR limesuite libiio libad9361-iio
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build

  macos_pothos_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} (pothos)
    steps:
      - uses: actions/checkout@v7
      - name: Uninstall openssl@1.1
        if: matrix.os == 'macos-15'
        run: brew uninstall openssl@1.1
      - name: Setup libs
        run: |
          brew tap pothosware/homebrew-pothos
          brew trust pothosware/homebrew-pothos
          brew update
          brew install soapysdr limesuite libiio libad9361
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build

  linux_build_job:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup tools
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          sudo apt-get install -q -y libsoapysdr-dev liblimesuite-dev libiio-dev libad9361-dev
      - name: Configure
        run: cmake -GNinja -B build
      - name: Build
        run: cmake --build build
